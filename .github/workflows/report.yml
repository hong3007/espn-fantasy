# 매시간 17분(그리고 Actions 탭의 Run workflow 버튼, '새 리포트 만들기' 이슈) 리포트를 만들어 GitHub Pages에 올린다.
# GitHub는 부하가 많으면 예약 실행을 늦추거나 건너뛴다. 3시간마다(하루 8번)로 두었을 때 실제로는 하루 3번(5시·11시·21시쯤)만 돌아서
# 매시간 시도한다(2026-11-07). 공개 저장소라 실행 시간 비용은 없다. 정각(0분)은 더 몰려서 17분.
# 필요한 저장소 설정: Secrets(ESPN_S2, SWID), Settings → Pages → Source: GitHub Actions
name: 리포트 만들기
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  issues:  # 리포트의 '지금 새로 만들기' → 저장소 주인이 '새 리포트 만들기' 이슈를 열면 실행(폰·PC, 로그인은 GitHub가 확인)
    types: [opened]
permissions:
  actions: write  # 아래 '자동 실행 켜기' 단계용
  contents: read
  issues: write  # 실행이 끝나면 그 이슈를 닫는다
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # 이슈로 실행할 때는 저장소 주인이 연 '새 리포트 만들기' 이슈만(다른 사람이 이슈를 열어도 실행되지 않음)
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '새 리포트 만들기'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/report.yml/enable  # 공개 저장소는 60일간 커밋이 없으면 꺼짐 → 매번 켜 둠(check 실패와 상관없이 먼저)
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install -r requirements-ci.txt  # PC 전용(Playwright·PyNaCl)을 뺀 고정 버전. 쿠키를 넘겨받는 라이브러리라 버전 고정
      - run: python check.py
      - run: python report.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          ACQ_LIMIT: ${{ vars.ACQ_LIMIT }}  # 매치업당 영입 한도. 비워 두면 report.py의 ACQ_LIMIT(6)
          TZ: Asia/Seoul
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - if: github.event_name == 'issues'
        run: gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} --comment "새 리포트를 올렸어요. 리포트 화면이 자동으로 바뀌어요."
        env:
          GH_TOKEN: ${{ github.token }}
