# 매일 한국시간 07:00(그리고 Actions 탭의 Run workflow 버튼)에 리포트를 만들어 GitHub Pages에 올린다.
# 필요한 저장소 설정: Secrets(ESPN_S2, SWID), Settings → Pages → Source: GitHub Actions
name: 리포트 만들기
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  actions: write  # 아래 '자동 실행 켜기' 단계용
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/report.yml/enable  # 공개 저장소는 60일간 커밋이 없으면 꺼짐 → 매번 켜 둠(check 실패와 상관없이 먼저)
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pip install -r requirements-ci.txt  # PC 전용(Playwright·PyNaCl)을 뺀 고정 버전. 쿠키를 넘겨받는 라이브러리라 버전 고정
      - run: python check.py
      - run: python report.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TZ: Asia/Seoul
      - run: mkdir site && cp report.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
