# 매일 한국시간 07:00(그리고 Actions 탭의 Run workflow 버튼)에 리포트를 만들어 GitHub Pages에 올린다.
# 필요한 저장소 설정: Secrets(ESPN_S2, SWID), Settings → Pages → Source: GitHub Actions
name: 리포트 만들기
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install espn_api==1.0.1 python-dotenv==1.2.4  # 클라우드는 쿠키를 비밀값으로 받아 Playwright가 필요 없다
      - run: python check.py
      - run: python report.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TZ: Asia/Seoul
      - run: mkdir site && cp report.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
